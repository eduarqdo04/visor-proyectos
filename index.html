<style>
:root {
  --real-vh: 1vh;
}

/* --- estilos --- */
.map-title {
    position:absolute;
    top:10px;
    left:50%;
    transform:translateX(-50%);
    font-size:40px;
    font-weight:700;
    background:#fff;
    padding:8px 16px;
    border-radius:4px;
    box-shadow:0 2px 5px rgba(0,0,0,0.3);
    z-index:9999;
}
/* ==================================================
   LEYENDA FIJA RESPONSIVE (SIN SCROLL)
   ================================================== */

.legend-container {
    position: absolute;
    bottom: 12px;
    left: 12px;
    right: 12px;
    background: #ffffff;
    padding: 6px 8px;
    border-radius: 6px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.3);
    z-index: 9999;
    box-sizing: border-box;
}

.legend-items {
    display: flex;
    flex-wrap: nowrap;   /* 🖥️ DESKTOP: una sola línea */
    gap: 10px;
    align-items: center;
    justify-content: flex-start;
    font-size: 14px;
    line-height: 1.2;
    white-space: nowrap;
}

.legend-item {
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
}

.legend-color {
    width: 12px;
    height: 12px;
    border-radius: 2px;
    flex-shrink: 0;
}

/* ================================
   DESKTOP — LEYENDA COMPLETA (AJUSTE TAMAÑO)
   ================================ */
@media (min-width: 769px) {

  .legend-container {
    left: 12px;
    right: auto;
    width: auto;
    max-width: none;
    padding: 10px 16px;     /* ⬆ más aire */
  }

  .legend-items {
    font-size: 18px;        /* ⬆ texto más grande */
    line-height: 1.35;
    gap: 14px;              /* ⬆ separación horizontal */
    white-space: nowrap;
  }

  .legend-item {
    gap: 6px;
  }

  .legend-color {
    width: 18px;            /* ⬆ color más visible */
    height: 18px;
    border-radius: 3px;
  }
}

.legend-item {
    display:flex;
    align-items:center;
}
.legend-color {
    width:16px;
    height:16px;
    margin-right:4px;
    border-radius:3px;
}
#search_input {
    position:absolute;
    top:70px;
    left:10px;
    z-index:9999;
    padding:6px 8px;
    border-radius:4px;
    border:1px solid #999;
    width:300px;
    font-size:13px;
}
#search_btn {
    position:absolute;
    top:70px;
    left:320px;
    z-index:9999;
    padding:6px 8px;
    border-radius:4px;
    border:1px solid #666;
    background:#f2f2f2;
    cursor:pointer;
}
.calle-label {
  font-size:11px;
  color:#003366;
  background: rgba(255,255,255,0.86);
  padding:1px 6px;
  border-radius:3px;
  border:0.5px solid #ccc;
  white-space:nowrap;
  box-shadow:0 1px 2px rgba(0,0,0,0.12);
  transform-origin:center center;
  display:inline-block;
  font-weight:700;
}

.highlighted {
  stroke: #000000 !important;
  stroke-width: 4 !important;
  fill-opacity: 0.75 !important;
  z-index: 999999 !important;
}

/* === POPUP RESPONSIVE CON SCROLL === */
.leaflet-popup-content {
  max-height: 70vh !important;
  overflow-y: auto !important;
  overflow-x: hidden !important;
}

/* === FIX PARA EXPORTACIÓN PDF === */
.print-popup,
.print-popup * {
  max-height: none !important;
  overflow: visible !important;
}

/* === FORMATO TEXTO JUSTIFICADO PARA PDF === */
.print-popup {
  text-align: justify;
  text-justify: inter-word;
}

.print-popup p,
.print-popup li,
.print-popup div {
  text-align: justify;
}

/* === FIX DEFINITIVO PDF (ANTI TEXTO MONTADO) === */

.print-popup .popup-row {
  display: block !important;
  margin-bottom: 10px !important;
  page-break-inside: avoid;
}

.print-popup .popup-row > div:first-child {
  display: block !important;
  font-weight: 700;
  margin-bottom: 3px;
  white-space: normal !important;
}

.print-popup .popup-row > div:last-child {
  display: block !important;
  margin-left: 0 !important;
  white-space: normal !important;
  word-break: break-word !important;
  overflow-wrap: break-word !important;
  line-height: 1.45 !important;
}

.print-popup {
  line-height: 1.45 !important;
  font-size: 11px !important;
}

.leaflet-popup-content-wrapper {
  max-width: 90vw !important;
}

/* === SPINNER PDF === */
.pdf-spinner {
  display:inline-block;
  width:14px;
  height:14px;
  border:2px solid rgba(255,255,255,0.6);
  border-top:2px solid #ffffff;
  border-radius:50%;
  animation: spin 0.8s linear infinite;
  vertical-align:middle;
  margin-right:6px;
}

@keyframes spin {
  0%   { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

#search_btn.searching {
    background:#ff9800 !important;
    color:#fff !important;
    box-shadow:0 0 6px rgba(255,152,0,0.9);
    transform:scale(1.05);
}

/* === EFECTO PARPADEO DE BORDE === */
@keyframes blinkStroke {
  0%   { stroke-opacity: 1; }
  50%  { stroke-opacity: 0.1; }
  100% { stroke-opacity: 1; }
}

.blink-border {
  animation: blinkStroke 0.6s ease-in-out infinite;
  stroke-width: 5 !important;
  stroke: #000000 !important;
  fill-opacity: 0.75 !important;
}

#clearSelectionBtn {
    margin-left: 6px;
    padding: 6px 10px;
    font-size: 13px;
    border-radius: 4px;
    border: 1px solid #888;
    background: #f5f5f5;
    cursor: pointer;
}

#clearSelectionBtn:hover {
    background: #e0e0e0;
}

#extendMapBtn {
    margin-left: 6px;
    padding: 6px 10px;
    font-size: 13px;
    border-radius: 4px;
    border: 1px solid #888;
    background: #f5f5f5;
    cursor: pointer;
}

#extendMapBtn:hover {
    background: #e0e0e0;
}

/* =====================================================
   RESPONSIVE MOBILE (CELULARES / IPHONE)
   ===================================================== */
@media (max-width: 768px) {

  .map-title {
      font-size: 18px !important;
      padding: 6px 10px !important;
      top: 6px !important;
  }

  .legend-container {
    font-size: 12px !important;
    padding: 6px 8px !important;
    bottom: 8px !important;
    left: 8px !important;
    max-width: calc(100vw - 16px);
    box-sizing: border-box;
}

  .legend-items {
      gap: 6px;
      flex-wrap: wrap;
  }

  #search_input {
      width: 200px !important;
      font-size: 13px !important;
      top: 52px !important;
  }

  #search_btn {
      font-size: 13px !important;
      top: 52px !important;
      left: 220px !important;
      padding: 6px 8px !important;
  }

  #clearSelectionBtn,
  #extendMapBtn {
      font-size: 12px !important;
      padding: 6px 8px !important;
  }

  .leaflet-control {
      transform: scale(0.85);
      transform-origin: top right;
  }

  .leaflet-popup-content {
      font-size: 13px !important;
  }
}

/* =====================================================
   AJUSTE FINO MOBILE – TITULO + BUSCADOR
   ===================================================== */
@media (max-width: 768px) {

  .map-title {
      position: relative !important;
      display: block;
      font-size: 18px !important;
      padding: 6px 10px !important;
      margin: 6px auto 4px auto !important;
      text-align: center;
      z-index: 1001;
  }

  #search_input {
      position: relative !important;
      display: block;
      width: 90% !important;
      max-width: 320px;
      margin: 4px auto !important;
      top: auto !important;
      left: auto !important;
  }

  #search_btn {
      position: relative !important;
      display: block;
      width: 140px;
      margin: 4px auto 8px auto !important;
      top: auto !important;
      left: auto !important;
  }
}

/* =====================================================
   TOOLTIP MARCADORES – MOBILE (OCULTOS POR DEFECTO)
   ===================================================== */
@media (max-width: 768px) {

  .leaflet-tooltip {
      display: none !important;
  }

}

/* === ETIQUETAS DE MARCADORES === */
.marker-label {
    display: none;
    pointer-events: none;
    white-space: nowrap;
}

/* =====================================================
   ALTURA REAL DEL MAPA – FIX iOS / ANDROID
   ===================================================== */
@media (max-width: 768px) {

  html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
  }

  #map {
      height: calc(var(--real-vh) * 100 - 180px) !important;
      min-height: 320px;
  }
}

/* ================================
   MÓVIL HORIZONTAL (LANDSCAPE)
   ================================ */
@media (max-height: 480px) and (orientation: landscape) {

  /* 🔹 Título compacto */
  .map-title {
    font-size: 14px !important;
    padding: 4px 8px !important;
    margin: 4px auto 2px auto !important;
    line-height: 1.1;
  }

  /* 🔹 Buscador compacto */
  #search_input {
    font-size: 12px !important;
    height: 28px;
    margin: 2px auto !important;
  }

  #search_btn {
    font-size: 12px !important;
    height: 28px;
    margin: 2px auto 6px auto !important;
  }

  /* 🔹 Leyenda fija y compacta */
  .legend-container {
    padding: 4px 6px !important;
    font-size: 11px !important;
    bottom: 6px !important;
  }

  .legend-items {
    gap: 4px 6px !important;
  }

  .legend-color {
    width: 10px !important;
    height: 10px !important;
  }

  /* 🔹 Controles Leaflet */
  .leaflet-control-zoom a {
    width: 26px;
    height: 26px;
    line-height: 26px;
  }

  .leaflet-control-layers {

function setRealVH() {

    document.documentElement.style.setProperty('--real-vh', vh + 'px');

    // 🔴 CLAVE: avisar a Leaflet que el tamaño cambió
    if (map) {
        setTimeout(function() {
            map.invalidateSize(true);
        }, 300);
    }
}

});

});

/* =====================================================
   MOSTRAR TOOLTIP SEGÚN ZOOM (MOBILE)
   ===================================================== */
function updateTooltipsByZoom() {
    if (!map) return;

    var isMobile = window.innerWidth <= 768;
    var zoom = map.getZoom();

    document.querySelectorAll('.leaflet-tooltip').forEach(function(t) {
        if (isMobile) {
            t.style.display = (zoom >= 18) ? 'block' : 'none';
        } else {
            t.style.display = 'block';
        }
    });
}

/* =====================================================
   MOSTRAR TEXTO DE MARCADORES SEGÚN ZOOM (MOBILE)
   ===================================================== */
function updateMarkerLabelsByZoom() {
    if (!map) return;

    var zoom = map.getZoom();
    var isMobile = window.matchMedia("(max-width: 768px)").matches;

    document.querySelectorAll('.marker-label').forEach(function(el) {

        // 🖥️ DESKTOP: siempre visibles
        if (!isMobile) {
            el.style.display = 'block';
            return;
        }

        // 📱 MÓVIL: solo al acercarse
        if (zoom >= 16) {
            el.style.display = 'block';
        } else {
            el.style.display = 'none';
        }
    });
}

var clearControl = L.control({ position: 'topright' });

clearControl.onAdd = function (map) {
    var div = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
    div.innerHTML = `
        <button id="clearSelectionBtn" title="Limpiar selección">
            🧹 Limpiar
        </button>
    `;

    // evitar zoom / drag al hacer clic
    L.DomEvent.disableClickPropagation(div);

    div.onclick = function () {
        clearSelection();
    };

    return div;

extendControl.onAdd = function (map) {
    var div = L.DomUtil.create('div', 'leaflet-bar leaflet-control');
    div.innerHTML = `
        <button id="extendMapBtn" title="Extender mapa">
            ⛶ Extender Mapa
        </button>
    `;

    L.DomEvent.disableClickPropagation(div);

    div.onclick = function () {
        extendMap();
    };

    return div;
};

// se añade cuando el mapa esté listo
document.addEventListener("DOMContentLoaded", function () {
    for (var k in window) {
        if (window[k] instanceof L.Map) {
            window[k].addControl(clearControl);
            window[k].addControl(extendControl);
            break;
        }
    }
});

function startBlink(layer, interval = 350) {
    if (!layer || !layer._path) return;

    // detener parpadeo previo
    stopBlink();

    var path = layer._path;
    var on = false;

    blinkingLayer = layer;

    blinkingTimer = setInterval(function () {
        if (on) {
            path.style.strokeOpacity = "1";
            path.style.strokeWidth = "5";
        } else {
            path.style.strokeOpacity = "0.15";
            path.style.strokeWidth = "2";
        }
        on = !on;
    }, interval);
}

function stopBlink() {
    if (blinkingTimer) {
        clearInterval(blinkingTimer);
        blinkingTimer = null;
    }

    if (blinkingLayer && blinkingLayer._path) {
        var p = blinkingLayer._path;
        p.style.strokeOpacity = "1";
        p.style.strokeWidth = "2";
    }

    blinkingLayer = null;
}

function clearSelection() {
    // detener parpadeo
    stopBlink();

    // cerrar popups
    if (map) {
        map.closePopup();
    }

    // restaurar estilo de todos los polígonos
    projectLayers.forEach(function(layer) {
        try {
            layer.setStyle({
                weight: 2,
                fillOpacity: 0.45
            });
        } catch (e) {}
    });

    // 🧹 limpiar buscador
    var input = document.getElementById("search_input");
    if (input) {
        input.value = "";
        input.blur();
    }

    // 🔍 AJUSTAR VISOR A TODOS LOS PROYECTOS
    if (map && globalBounds) {
        map.fitBounds(globalBounds, {
            padding: [50, 50],
            maxZoom: 18
        });
    }
}

function extendMap() {

    // detener parpadeos
    stopBlink();

    // cerrar popups
    if (map) {
        map.closePopup();
    }

    // encuadrar todo el visor
    if (map && globalBounds) {
        map.fitBounds(globalBounds, {
            padding: [60, 60],
            maxZoom: 18
        });
    }
}

    for (var k in window) {
        if (window[k] instanceof L.Map) {
            map = window[k];

        }
    }

    if (map) {
        map.whenReady(function () {
            mapReady = true;

            // 🔍 AJUSTAR MAPA AL CARGAR (VER TODOS LOS POLÍGONOS)
            if (globalBounds) {
                map.fitBounds(globalBounds, {

                    maxZoom: 18
                });
            }

            // ✅ CONTROL DE ETIQUETAS
            updateTooltipsByZoom();
            updateMarkerLabelsByZoom();

            setTimeout(function() {
                updateMarkerLabelsByZoom();
            }, 500);

            map.on('zoomend', function() {
                updateMarkerLabelsByZoom();
            });
        });
    }
});

        function finalizar() {
            btn.disabled = false;
            btn.innerHTML = originalHTML;
            btn.style.cursor = "pointer";

        function generarPDF() {
            wrapper.appendChild(popupContent);

                margin: 10,
                filename: proyecto.replace(/\s+/g,'_') + '.pdf',
                image: { type: 'jpeg', quality: 0.98 },

              .from(wrapper)
              .save()
              .then(finalizar)
              .catch(finalizar);

var pdfGenerado = false;

function generarPDFSeguro() {
    if (pdfGenerado) return;
    pdfGenerado = true;
    generarPDF();
}

// ⏱️ si el mapa no responde en 1.5s → generar PDF igual
setTimeout(generarPDFSeguro, 1500);

            if (!pdfGenerado && !err && canvas) {
                var img = document.createElement("img");
                img.src = canvas.toDataURL("image/png");
                img.style.width = "100%";
                img.style.marginBottom = "8px";
                wrapper.appendChild(img);
            }
            generarPDFSeguro();
        });
    } else {
        generarPDFSeguro();
    }
} catch(e) {
    console.error("Error exportando PDF:", e);
    generarPDFSeguro();
}

function updateMarkerLabelsByZoom() {
    if (typeof map === 'undefined') return;

    var zoom = map.getZoom();
    var isMobile = window.matchMedia("(pointer: coarse)").matches;

    document.querySelectorAll('.marker-label').forEach(function(el) {

        // 🖥️ Desktop real → siempre visible
        if (!isMobile) {
            el.style.display = 'block';
            return;
        }

        // 📱 Móvil → solo mostrar con zoom alto
        if (zoom >= 17) {
            el.style.display = 'block';
        } else {
            el.style.display = 'none';
        }
    });
}

// Eventos Leaflet
map.on('zoomend', updateMarkerLabelsByZoom);
map.whenReady(function() {
    updateMarkerLabelsByZoom();
